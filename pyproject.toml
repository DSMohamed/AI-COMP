[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaming-ai"
version = "0.1.0"
description = "A modular, local-first AI gaming companion with speech, vision, RAG, and memory optimized for RTX 3070 8GB."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Local AI Gaming Companion Contributors" }
]
requires-python = ">=3.10"
keywords = ["ai", "gaming", "companion", "speech-to-text", "tts", "ollama", "whisper", "vision", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "faster-whisper>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "colorama>=0.4.6",
    "pyttsx3>=2.90",
    "onnxruntime>=1.16.0"
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.8.0",
    "mss>=9.0.0",
    "pillow>=10.0.0"
]
rag = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0"
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
gaming-ai = "gaming_ai.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gaming_ai*"]
